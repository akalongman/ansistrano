---

- name: "APP | Generate Doctrine Proxies"
  shell: "php artisan doctrine:generate:proxies --no-interaction"
  args:
    chdir: "{{ ansistrano_release_path.stdout }}"
  run_once: true
  tags:
    - app
    - pre

- name: "APP | Clear Doctrine Metadata Cache"
  shell: "php artisan doctrine:clear:metadata:cache --no-interaction"
  args:
    chdir: "{{ ansistrano_release_path.stdout }}"
  run_once: true
  tags:
    - app
    - pre
